<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Credenciamento</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body{
margin:0;
padding:20px;
font-family:Arial;
background:#f4f4f4;
text-align:center;
}

h2{
color:#1565C0;
}

#reader{
width:350px;
max-width:95%;
margin:auto;
}

#status{
margin-top:20px;
font-size:20px;
font-weight:bold;
color:#FFFF00;
}

button{

padding:14px 30px;
font-size:18px;
margin-top:20px;

}

</style>

</head>

<body>

<h2>
SIGEC<br>
Credenciamento
</h2>

<div id="reader"></div>

<div id="status">
Abrindo câmera...
</div>

<button id="btnCamera" onclick="abrirCamera()">
Abrir câmera
</button>

<script>

const URL_SCRIPT =
"https://script.google.com/macros/s/AKfycbz_tkaCt8HMAlCEgkXViu7t--sDCRMJj0JZUWfDzUJPoGGwQ4UNjpgkZ2xkHxjlzzSGjg/exec";

let scanner = null;
let lendo = false;


/* =========================
   ABRIR CÂMERA
========================= */

function abrirCamera(){

    document.getElementById("status").innerHTML =
    "Abrindo câmera...";

    if(scanner){

        scanner.stop().catch(function(){});

    }

    scanner = new Html5Qrcode("reader");

    scanner.start(

        { facingMode: "environment" },

        {
            fps: 10,
            qrbox: 250
        },

        sucesso,

        erro

    )
    .then(function(){

        document.getElementById("status").innerHTML =
        "Aponte para o QR Code";

        document.getElementById("btnCamera").style.display =
        "none";

    })
    .catch(function(e){

        console.error(e);

        document.getElementById("status").innerHTML =
        "Erro ao abrir câmera: " + e;

        document.getElementById("btnCamera").style.display =
        "inline-block";

    });

}


/* =========================
   QR CODE ENCONTRADO
========================= */

async function sucesso(codigo){

    if(lendo) return;

    lendo = true;

    document.getElementById("status").innerHTML =
    "Consultando participante...";


    try{

        const resposta = await fetch(

            URL_SCRIPT +
            "?codigo=" +
            encodeURIComponent(codigo)

        );


        const dados = await resposta.json();


        /* VIBRAÇÃO */

        if(navigator.vibrate){

            navigator.vibrate([150,80,150]);

        }


        /* SOM */

        const audio = new Audio(
            "https://actions.google.com/sounds/v1/cartoon/pop.ogg"
        );

        audio.play().catch(function(){});


        /* =========================
           CREDENCIAMENTO OK
        ========================= */

        if(dados.status === "OK"){

            document.body.style.background =
            "#2E7D32";

            document.getElementById("status").innerHTML =
            "✅ CREDENCIAMENTO REALIZADO<br><br>" +
            "<strong>" + dados.nome + "</strong>";

        }


        /* =========================
           JÁ CREDENCIADO
        ========================= */

        else if(dados.status === "JA_CREDENCIADO"){

            document.body.style.background =
            "#F57C00";

            document.getElementById("status").innerHTML =
            "⚠️ JÁ CREDENCIADO<br><br>" +
            "<strong>" + dados.nome + "</strong>";

        }


        /* =========================
           NÃO ENCONTRADO
        ========================= */

        else{

            document.body.style.background =
            "#C62828";

            document.getElementById("status").innerHTML =
            "❌ PARTICIPANTE NÃO ENCONTRADO";

        }


        /* =========================
           VOLTA PARA LEITURA
        ========================= */

        setTimeout(function(){

            document.body.style.background =
            "#f4f4f4";

            document.getElementById("status").innerHTML =
            "Aponte para o QR Code";

            lendo = false;

        },3000);


    }

    catch(e){

        console.error(e);

        lendo = false;

        document.getElementById("status").innerHTML =
        "❌ Erro de comunicação.";

    }

}


/* =========================
   ERROS DE LEITURA
========================= */

function erro(errorMessage){

    // Não mostra os erros normais
    // enquanto a câmera procura o QR Code.

}


/* =========================
   ABRIR AUTOMATICAMENTE
========================= */

window.onload = function(){

    abrirCamera();

};

</script>
