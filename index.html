<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Credenciamento - Simpósio de Educação</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>

body{
    margin:0;
    padding:20px;
    font-family:Arial;
    background:#f5f5f5;
    text-align:center;
}

h1{
    color:#1565C0;
}

#reader{
    width:320px;
    margin:auto;
}

button{

    margin-top:20px;
    padding:15px 25px;
    font-size:18px;
    border:none;
    border-radius:8px;
    background:#1565C0;
    color:white;
    cursor:pointer;

}

button:hover{

    background:#0D47A1;

}

#mensagem{

    margin-top:20px;
    font-size:18px;
    font-weight:bold;

}

</style>

</head>

<body>

<h1>📱 Credenciamento</h1>

<p>Simpósio de Educação</p>

<div id="reader"></div>

<button onclick="iniciarScanner()">
Abrir câmera
</button>

<div id="mensagem"></div>

<script>

let scanner;

function iniciarScanner(){

    document.getElementById("mensagem").innerHTML =
    "Abrindo câmera...";

    scanner = new Html5Qrcode("reader");

    scanner.start(

        {
            facingMode:"environment"
        },

        {

            fps:10,

            qrbox:{
                width:250,
                height:250
            }

        },

        function(decodedText){

            document.getElementById("mensagem").innerHTML =
            "QR Code encontrado.";

            scanner.stop().then(function(){

                window.location.href =
                "https://script.google.com/macros/s/AKfycbyE0Xo39X-BjJxwTzKfEvffUlSYrYseVfgPqfHUxLfwPyfugkNcAmNMZo2fOmSfXYxNyg/exec?codigo="
                + encodeURIComponent(decodedText);

            });

        },

        function(error){

            // ignora erros de leitura

        }

    ).catch(function(err){

        document.getElementById("mensagem").innerHTML =
        "Erro: " + err;

    });

}

</script>

</body>
</html>
