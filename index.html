<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Credenciamento</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body{
margin:0;
padding:20px;
font-family:Arial;
background:#f4f4f4;
text-align:center;
}

h2{
color:#1565C0;
}

#reader{
width:350px;
max-width:95%;
margin:auto;
}

#status{
margin-top:20px;
font-size:20px;
font-weight:bold;
color:#1565C0;
}

button{

padding:14px 30px;
font-size:18px;
margin-top:20px;

}

</style>

</head>

<body>

<h2>
SIGEC<br>
Credenciamento
</h2>

<div id="reader"></div>

<div id="status">
Abrindo câmera...
</div>

<button id="btnCamera" onclick="abrirCamera()">
Abrir câmera
</button>

<script>

const URL_SCRIPT =
"https://script.google.com/macros/s/AKfycbz_tkaCt8HMAlCEgkXViu7t--sDCRMJj0JZUWfDzUJPoGGwQ4UNjpgkZ2xkHxjlzzSGjg/exec";

let scanner;

let lendo=false;

function abrirCamera(){

document.getElementById("status").innerHTML="Abrindo câmera...";

scanner=new Html5Qrcode("reader");

scanner.start(

{ facingMode:"environment" },

{

fps:10,

qrbox:250

},

sucesso,

erro

).then(()=>{

document.getElementById("status").innerHTML="Aponte para o QR Code";

document.getElementById("btnCamera").style.display="none";

});

}

async function sucesso(codigo){

    if(lendo) return;

    lendo = true;

    document.getElementById("status").innerHTML =
    "Consultando participante...";

    try{

        const resposta = await fetch(
            URL_SCRIPT +
            "?codigo=" +
            encodeURIComponent(codigo)
        );

        const dados = await resposta.json();

        if(navigator.vibrate){
            navigator.vibrate(200);
        }

        const audio = new Audio(
            "https://actions.google.com/sounds/v1/cartoon/pop.ogg"
        );

        audio.play().catch(()=>{});

        if(dados.status=="OK"){

            document.body.style.background="#2E7D32";

            document.getElementById("status").innerHTML =
            "✅ " + dados.nome;

        }

        else if(dados.status=="JA_CREDENCIADO"){

            document.body.style.background="#f57c00";

            document.getElementById("status").innerHTML =
            "⚠️ " + dados.nome + "<br>Já credenciado";

        }

        else{

            document.body.style.background="#C62828";

            document.getElementById("status").innerHTML =
            "❌ Participante não encontrado";

        }

        setTimeout(function(){

            document.body.style.background="#f4f4f4";

            document.getElementById("status").innerHTML =
            "Aponte para o QR Code";

            lendo = false;

        },1500);

    }
    catch(e){

        console.log(e);

        lendo = false;

        document.getElementById("status").innerHTML =
        "Erro de comunicação.";

    }

}function erro(){

}

window.onload=abrirCamera;

</script>

</body>

</html>
